<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			ALL SEO/social metadata is static, in this file, on purpose.
			Unfurlers (LinkedIn, Slack, WhatsApp, X) fetch the HTML and do NOT run
			JavaScript — anything injected by React is invisible to them.
		-->
		<title>Terms of Service — GTMX Agents</title>
		<meta
			name="description"
			content="Terms of Service for GTMX Agents. Acceptable use, email outreach authorization, anti-spam obligations, and service terms."
		/>
		<!-- Absolute canonical: prevents duplicate indexing -->
		<link rel="canonical" href="https://gtmxagents.com/terms" />
		<meta name="robots" content="index, follow" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="GTMX Agents" />
		<meta property="og:url" content="https://gtmxagents.com/terms" />
		<meta property="og:title" content="Terms of Service — GTMX Agents" />
		<meta
			property="og:description"
			content="Terms of Service for GTMX Agents. Acceptable use, email outreach authorization, anti-spam obligations, and service terms."
		/>
		<meta property="og:image" content="https://gtmxagents.com/og.png" />
		<meta property="og:image:secure_url" content="https://gtmxagents.com/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="GTMX Agents — agents that run your fundraise" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Terms of Service — GTMX Agents" />
		<meta
			name="twitter:description"
			content="Terms of Service for GTMX Agents. Acceptable use, email outreach authorization, anti-spam obligations, and service terms."
		/>
		<meta name="twitter:image" content="https://gtmxagents.com/og.png" />
		<meta name="twitter:image:alt" content="Terms of Service — GTMX Agents" />

		<!-- Web fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=swap"
		/>

		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />

		<!-- Favicons -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/favicon.svg" />

		<!-- JSON-LD -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebPage",
				"name": "Terms of Service — GTMX Agents",
				"url": "https://gtmxagents.com/terms",
				"description": "Terms of Service for GTMX Agents.",
				"isPartOf": {
					"@type": "WebSite",
					"name": "GTMX Agents",
					"url": "https://gtmxagents.com/"
				}
			}
		</script>
	</head>
	<body>
		<div id="root">
			<noscript>
				<h1>Terms of Service</h1>
				<p>
					Review the terms of service, acceptable use policies, and anti-spam obligations for using GTMX Agents.
				</p>
			</noscript>
		</div>
		<script type="module" src="/src/entries/terms.tsx"></script>
	</body>
</html>
